name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SummonersVault.slnx

      - name: Build
        run: dotnet build SummonersVault.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SummonersVault.slnx -c Release --no-build

      - name: Validate self-contained publish
        run: dotnet publish src/SummonersVault.App/SummonersVault.App.csproj -c Release -r win-x64 --self-contained true --no-build -o artifacts/publish/win-x64
