name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SummonersVault.slnx

      - name: Restore pinned tools
        run: dotnet tool restore

      - name: Verify formatting and code style
        run: dotnet format SummonersVault.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build SummonersVault.slnx -c Release --no-restore

      - name: Verify EF Core model matches migrations
        run: dotnet ef migrations has-pending-model-changes --project src/SummonersVault.Infrastructure/SummonersVault.Infrastructure.csproj --context VaultDbContext --configuration Release --no-build

      - name: Test
        run: dotnet test SummonersVault.slnx -c Release --no-build

      - name: Validate self-contained publish
        run: dotnet publish src/SummonersVault.App/SummonersVault.App.csproj -c Release -r win-x64 --self-contained true --no-build -o artifacts/publish/win-x64
